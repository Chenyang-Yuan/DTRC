name: Core tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install numpy==2.2.6 h5py==3.16.0
          python -m pip install -e ".[data]"
      - name: Run numerical and training tests
        run: python -m unittest discover -s tests -v
      - name: Check command-line entry points
        run: |
          dtrc-train --help
          dtrc-cache-hdf5 --help
          dtrc-cache-lance --help
          dtrc-prepare-ogbench --help
          dtrc-manifest-lewm --help
          dtrc-manifest-ogbench --help
          dtrc-evaluate-lewm --help
          dtrc-evaluate-ogbench --help
          dtrc-diagnose --help
